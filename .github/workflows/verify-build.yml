name: Android CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # =========================================================================
  # STAGE 1: Verify Build & Test
  # =========================================================================
  verify-build-test:
    name: STAGE 1 - Verify Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/*
            **/build/test-results/testDebugUnitTest/*
            **/build/reports/lint-results-debug.*

  # =========================================================================
  # STAGE 2: Code Quality & Static Analysis
  # =========================================================================
  code-quality:
    name: STAGE 2 - Code Quality & Static Analysis
    needs: verify-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Ensure gradle wrapper has execution privileges
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Run Detekt static analysis
      - name: Run Detekt Static Analysis
        run: ./gradlew detekt

      # Run Ktlint code format check
      - name: Run Ktlint Code Format Check
        run: ./gradlew ktlintCheck

      # Upload Detekt and Ktlint reports as build artifacts
      - name: Upload Static Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt/*
            **/build/reports/ktlint/*

  # =========================================================================
  # STAGE 3: Security & Vulnerability Scanning (SAST / Dependency Scan)
  # =========================================================================
  security-sast-codeql:
    name: STAGE 3 - CodeQL Security Scan (SAST)
    needs: verify-build-test
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Project for CodeQL Analysis
        run: ./gradlew assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  security-dependency-scan:
    name: STAGE 3 - OWASP Dependency Check (SCA)
    needs: verify-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Cache OWASP Dependency Check Data
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Run OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check/*

  # =========================================================================
  # STAGE 4: Artifact Archiving / Publishing
  # =========================================================================
  artifact-publishing:
    name: STAGE 4 - Artifact Archiving & Publishing
    needs: [verify-build-test, code-quality, security-sast-codeql, security-dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Only run archiving/publishing on push merges to develop and main
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Build Debug APK (executable application)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Archive Debug APK on GitHub actions dashboard
      - name: Archive Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish AAR libraries (:core, :core-ui, etc.) to GitHub Packages maven registry
      - name: Publish Libraries to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
